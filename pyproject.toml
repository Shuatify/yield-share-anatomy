[project]
name = "yield-share-anatomy"
version = "0.1.0"
description = "Research pipeline for TSLA vs YTSL historical data"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas>=2.1,<3",
    "requests>=2.31,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests_yield"]
pythonpath = ["."]
