name: Freeze TSLA CDR reviewed candidate snapshot

on:
  push:
    branches:
      - feature/tsla-cdr-collection-20261124
    paths:
      - .github/workflows/pin-tsla-cdr.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/tsla-cdr-collection-20261124
          persist-credentials: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Generate candidate and review inputs
        run: |
          uv run --locked python -m yield_share_anatomy.cdr \
            --out outputs/cdr_collection \
            --calendar-csv data/snapshots/2026-11-20/ytsl_purpose_daily.csv \
            --exchange-csv data/reference/tsla_cdr_tsx_alpha_spot_checks_2026-11-24.csv \
            --secondary-csv data/reference/tsla_cdr_stockwatch_legacy_spot_check_2026-11-24.csv
      - name: Assert reviewed source constraints and freeze inputs
        run: |
          uv run --locked python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import shutil
          import pandas as pd

          out = Path("outputs/cdr_collection")
          dest = Path("data/snapshots/2026-11-20-cdr-yahoo")
          dest.mkdir(parents=True, exist_ok=True)
          qc = json.loads((out / "quality_report.json").read_text())
          prices = pd.read_csv(out / "tsla_cdr_preliminary_daily.csv")
          assert len(prices) == 983, len(prices)
          assert prices.date.iloc[0] == "2022-12-21"
          assert prices.date.iloc[-1] == "2026-11-20"
          assert not prices.date.duplicated().any()
          assert not qc["reference_calendar_missing_dates"]
          assert all(prices.ticker == "TSLA.TO")
          assert qc["sources"]["TSLA.NE"]["rows"] == 0
          assert qc["sources"]["TSLA.TO"]["rows"] == 983

          files = {
              "tsla_cdr_yahoo_daily.csv": "tsla_cdr_preliminary_daily.csv",
              "yahoo_TSLA_TO_raw.json": "yahoo_TSLA_TO_raw.json",
              "quality_report.json": "quality_report.json",
          }
          for dest_name, source_name in files.items():
              shutil.copyfile(out / source_name, dest / dest_name)
          manifest = {
              "status": "reviewed_vendor_data_with_residual_legacy_provenance_risk",
              "sample_end": "2026-11-20",
              "frozen_on": "2026-11-24",
              "rows": 983,
              "base_currency": "CAD",
              "instrument": "TSLA CDR (CIBC)",
              "source_symbol": "TSLA.TO",
              "pre_tsx_symbol_history": "Yahoo TSLA.TO backfill, historical Cboe venue",
              "basis": "Close in CAD; Adj Close checked against Close",
              "cash_distributions": "Assumed zero based on CIBC product Dividend History N/A; issuer action re-check before publication",
              "residual_risk": "539 pre-2025-02-14 Yahoo backfill observations not each individually checked against Cboe",
              "sha256": {
                  name: hashlib.sha256((dest / name).read_bytes()).hexdigest()
                  for name in files
              },
          }
          (dest / "source_manifest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Commit input snapshot to feature branch (never main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/2026-11-20-cdr-yahoo/
          if ! git diff --cached --quiet; then
            git commit -m "Freeze reviewed 983-day TSLA CDR candidate and raw Yahoo evidence"
            git push origin HEAD:feature/tsla-cdr-collection-20261124
          fi
