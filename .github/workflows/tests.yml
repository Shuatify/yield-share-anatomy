name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run offline tests
        run: uv run --locked pytest -q
      - name: One-off early YTSL Yahoo quote source probe
        run: uv run --locked python scripts/probe_yahoo_early_ytsl.py
