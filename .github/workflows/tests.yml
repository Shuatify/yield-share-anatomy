name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run offline tests
        run: uv run --locked pytest -q
      - name: Smoke-test offline research entrypoints
        run: |
          uv run --locked python -m yield_share_anatomy.fetch --fixture-dir tests/fixtures --out outputs/fixture_fetch > /dev/null
          uv run --locked python -m yield_share_anatomy.returns > /dev/null
          uv run --locked python -m yield_share_anatomy.nav > /dev/null
          uv run --locked python -m yield_share_anatomy.benchmark > /dev/null
          uv run --locked python -m yield_share_anatomy.market > /dev/null
          uv run --locked python -m yield_share_anatomy.regimes > /dev/null
      - name: Validate real-data 46-month regimes
        run: |
          uv run --locked python -m yield_share_anatomy.monthly_validation > /dev/null
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("outputs/regime_validation/regime_validation_status.json").read_text())
          assert report["status"] == "pass"
          assert report["month_count"] == 46
          print(json.dumps({
              "status": report["status"],
              "month_count": report["month_count"],
              "max_abs_difference_pp": report["max_abs_difference_pp"],
              "regime_summary": report["regime_summary"],
          }, indent=2))
          PY
      - name: Analyze real-data effective beta and bootstrap CI
        run: |
          uv run --locked python -m yield_share_anatomy.exposure > /dev/null
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("outputs/effective_beta/effective_beta_summary.json").read_text())
          assert r["status"] == "ok"
          assert r["paired_intervals"] == 962
          assert abs(r["full_daily"]["beta"] - 1.0840605323710557) < 1e-9
          assert r["block_bootstrap"]["replicates"] == 800
          print(json.dumps({
              "start": r["start"], "end": r["end"],
              "n": r["paired_intervals"],
              "full": r["full_daily"],
              "directional": r["daily_directional"],
              "bootstrap": r["block_bootstrap"],
              "rolling": r["rolling"],
              "monthly": r["monthly_46"],
          }, indent=2))
          PY
