name: Python tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.13
        run: uv python install 3.13
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run offline tests
        run: uv run --locked pytest -q
      - name: Smoke-test offline research entrypoints
        run: |
          uv run --locked python -m yield_share_anatomy.fetch --fixture-dir tests/fixtures --out outputs/fixture_fetch > /dev/null
          uv run --locked python -m yield_share_anatomy.returns > /dev/null
          uv run --locked python -m yield_share_anatomy.nav > /dev/null
          uv run --locked python -m yield_share_anatomy.benchmark > /dev/null
          uv run --locked python -m yield_share_anatomy.market > /dev/null
          uv run --locked python -m yield_share_anatomy.regimes > /dev/null
      - name: Validate real-data 46-month regimes
        run: |
          uv run --locked python -m yield_share_anatomy.monthly_validation > /dev/null
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("outputs/regime_validation/regime_validation_status.json").read_text())
          assert report["status"] == "pass"
          assert report["month_count"] == 46
          print(json.dumps({
              "status": report["status"],
              "month_count": report["month_count"],
              "max_abs_difference_pp": report["max_abs_difference_pp"],
              "regime_summary": report["regime_summary"],
          }, indent=2))
          PY
      - name: Analyze real-data effective beta and bootstrap CI
        run: |
          uv run --locked python -m yield_share_anatomy.exposure > /dev/null
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("outputs/effective_beta/effective_beta_summary.json").read_text())
          assert r["status"] == "ok"
          assert r["paired_intervals"] == 962
          assert abs(r["full_daily"]["beta"] - 1.0840605323710557) < 1e-9
          assert r["block_bootstrap"]["replicates"] == 800
          print(json.dumps({
              "start": r["start"], "end": r["end"],
              "n": r["paired_intervals"],
              "full": r["full_daily"],
              "directional": r["daily_directional"],
              "bootstrap": r["block_bootstrap"],
              "rolling": r["rolling"],
              "monthly": r["monthly_46"],
              "annual": r["annual"],
          }, indent=2))
          PY
      - name: Bootstrap block-length sensitivity
        run: |
          for block in 5 21; do
            uv run --locked python -m yield_share_anatomy.exposure \
              --block "$block" --replicates 400 --seed 20261120 \
              --out "outputs/effective_beta_block_${block}" > /dev/null
          done
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          for block in (5, 21):
              file = Path(f"outputs/effective_beta_block_{block}/effective_beta_summary.json")
              report = json.loads(file.read_text())
              ci = report["block_bootstrap"]["beta_ci_95"]["down_minus_up"]
              print(f"block={block}, CI(down-up)={ci}, includes_zero={report['block_bootstrap']['delta_includes_zero']}")
              assert report["block_bootstrap"]["replicates"] == 400
              assert report["paired_intervals"] == 962
          PY
      - name: Reconcile exact real-data compounding identity
        run: |
          uv run --locked python -m yield_share_anatomy.compounding > /dev/null
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("outputs/compounding/compounding_summary.json").read_text())
          assert r["status"] == "pass" and r["paired_intervals"] == 962
          assert abs(r["wealth"]["terminal_return_gap_pp_of_initial_capital"] + 44.13329311080821) < 1e-8
          c = r["components_100x_decimal"]
          assert abs(c["relative_log_wealth_100x"] + 18.25144128520136) < 1e-8
          assert abs(c["identity_residual_100x"]) < 1e-9
          print(json.dumps({
              "wealth": r["wealth"],
              "components": c,
              "yearly": r["by_year"],
              "extremes": r["extremes"],
              "input_sha256": r["input_sha256"],
          }, indent=2))
          PY
      - name: Reproduce daily-reset leverage counterfactuals
        run: |
          uv run --locked python -m yield_share_anatomy.leverage > /dev/null
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("outputs/leverage_counterfactual/leverage_counterfactual_summary.json").read_text())
          assert r["status"] == "pass"
          assert r["native_tsla_trading_closes"] == 983
          assert r["shared_nav_tsla_closes"] == 963
          assert r["shared_return_intervals"] == 962
          assert [x["leverage"] for x in r["scenarios"]] == [1.0, 1.1, 1.2]
          assert abs(r["scenarios"][0]["total_return_pct"] - 164.54468803302754) < 1e-8
          assert abs(r["scenarios"][1]["total_return_pct"] - 171.7657053260988) < 1e-8
          assert abs(r["scenarios"][2]["total_return_pct"] - 175.62690522311652) < 1e-8
          print(json.dumps({
              "actual_ytsl_nav": r["actual_ytsl_nav"],
              "scenarios": r["scenarios"],
              "assumptions": r["assumptions"],
              "input_sha256": r["input_sha256"],
          }, indent=2))
          PY
